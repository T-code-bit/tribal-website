<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to the Tribal Website. Explore your diversity with us.">
    <title>Tribal Website</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Caveat:wght@400;600&family=Roboto:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css" />

    <style>
        /* Custom cursor */
        body {
            cursor: url('custom-cursor.png'), auto;
            background: url('background-image.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Back-to-top button */
        #back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #back-to-top:hover {
            background-color: #555;
        }

        /* Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #preloader .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #333;
            animation: spin 1s ease infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Welcome page styles */
        .welcome-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgba(240, 240, 240, 0.8);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .welcome-container {
            max-width: 600px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .welcome-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .enter-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .enter-button:hover {
            background-color: #555;
        }

        /* Clock & interactive map styles */
        #clock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            color: #333;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #map {
            height: 400px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Blog section styles */
        .blog-section {
            background-color: #fff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .blog-title {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .blog-content {
            font-size: 1.2rem;
        }
    </style>
</head>

<body class="welcome-page">
    <div id="preloader">
        <div class="spinner"></div>
    </div>
    <div class="welcome-container">
        <h1 class="welcome-title">Welcome to Tribal Website</h1>
        <h2 class="welcome-subtitle">EXPLORE YOUR DIVERSITY WITH US</h2>
        <p class="welcome-text">Experience the journey with us</p>
        <a href="main.html" class="enter-button">Enter Site</a>
    </div>
    <div id="clock"></div>
    <div id="map"></div>

    <!-- Embedded Video -->
    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/samplevideo" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Blog Section -->
    <div class="blog-section">
        <h3 class="blog-title">Recent Blogs</h3>
        <div class="blog-content">
            <!-- Here you can dynamically load or list your blog posts -->
            <p>Discover the fascinating stories and traditions of tribes from around the world. Stay tuned for more updates!</p>
        </div>
    </div>
    <button id="back-to-top">↑</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"></script>
    <script>
        function updateClock() {
            const clock = document.getElementById('clock');
            const now = new Date();
            clock.textContent = now.toLocaleTimeString();
        }

        // Update clock every second
        setInterval(updateClock, 1000);
        updateClock(); // Initial call

        // Back-to-top button functionality
        const backToTopButton = document.getElementById('back-to-top');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopButton.style.display = 'block';
            } else {
                backToTopButton.style.display = 'none';
            }
        });

        backToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Hide preloader after page load
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            preloader.style.display = 'none';
        });

        // Initialize interactive map
        const map = L.map('map').setView([0, 0], 2); // Set your preferred zoom level and coordinates
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        <!-- Loader -->
<div id="loader"></div>

<style>
#loader {
    border: 16px solid #f3f3f3;
    border-radius: 50%;
    border-top: 16px solid #3498db;
    width: 120px;
    height: 120px;
    animation: spin 2s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>

<script>
    // Loader script
    document.onreadystatechange = function () {
        if (document.readyState !== "complete") {
            document.querySelector("#loader").style.display = "block";
        } else {
            document.querySelector("#loader").style.display = "none";
        }
    };
</script>


        // Add markers or layers to the map as needed
    </script>
</body>

</html>
