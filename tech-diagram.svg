<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
    <style>
        .bg { fill: #1A1A1A; }
        .node { fill: #8B4513; stroke: #D2691E; stroke-width: 2; }
        .connection { stroke: #2E8B57; stroke-width: 2; stroke-dasharray: 5,5; }
        .label { font-family: Arial, sans-serif; fill: #F4E1D2; font-size: 14px; }
    </style>
    
    <!-- Background -->
    <rect width="100%" height="100%" class="bg"/>
    
    <!-- Nodes -->
    <circle cx="150" cy="100" r="50" class="node"/>
    <circle cx="450" cy="100" r="50" class="node"/>
    <circle cx="150" cy="300" r="50" class="node"/>
    <circle cx="450" cy="300" r="50" class="node"/>
    
    <!-- Connections -->
    <line x1="200" y1="100" x2="400" y2="100" class="connection"/>
    <line x1="150" y1="150" x2="150" y2="250" class="connection"/>
    <line x1="450" y1="150" x2="450" y2="250" class="connection"/>
    
    <!-- Labels -->
    <text x="150" y="105" text-anchor="middle" class="label">Frontend</text>
    <text x="450" y="105" text-anchor="middle" class="label">Backend</text>
    <text x="150" y="305" text-anchor="middle" class="label">Database</text>
    <text x="450" y="305" text-anchor="middle" class="label">Cloud</text>
</svg>
