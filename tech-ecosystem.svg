<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
    <style>
        .bg { fill: #1A1A1A; }
        .node { 
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .node:hover { 
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(210, 105, 30, 0.7));
        }
        .connection { 
            stroke: rgba(46, 139, 87, 0.5); 
            stroke-width: 2; 
            stroke-dasharray: 5,5;
            transition: stroke 0.3s ease;
        }
        .label { 
            font-family: 'Arial', sans-serif; 
            fill: #F4E1D2; 
            font-size: 14px; 
            text-anchor: middle;
            transition: all 0.3s ease;
        }
        .tech-icon {
            transition: all 0.3s ease;
        }
    </style>
    
    <!-- Background -->
    <rect width="100%" height="100%" class="bg"/>
    
    <!-- Central Hub -->
    <circle cx="400" cy="250" r="100" fill="rgba(139, 69, 19, 0.6)" class="node" data-tech="Core Platform"/>
    <text x="400" y="250" class="label">Core Platform</text>
    
    <!-- Technology Nodes -->
    <g class="tech-icon">
        <circle cx="200" cy="100" r="50" fill="rgba(46, 139, 87, 0.6)" class="node" data-tech="Frontend"/>
        <text x="200" y="100" class="label">Frontend</text>
        <image x="175" y="75" width="50" height="50" href="react-logo.png"/>
    </g>
    
    <g class="tech-icon">
        <circle cx="600" cy="100" r="50" fill="rgba(46, 139, 87, 0.6)" class="node" data-tech="Backend"/>
        <text x="600" y="100" class="label">Backend</text>
        <image x="575" y="75" width="50" height="50" href="python-logo.png"/>
    </g>
    
    <g class="tech-icon">
        <circle cx="200" cy="400" r="50" fill="rgba(46, 139, 87, 0.6)" class="node" data-tech="Database"/>
        <text x="200" y="400" class="label">Database</text>
        <image x="175" y="375" width="50" height="50" href="mongodb-logo.png"/>
    </g>
    
    <g class="tech-icon">
        <circle cx="600" cy="400" r="50" fill="rgba(46, 139, 87, 0.6)" class="node" data-tech="Cloud"/>
        <text x="600" y="400" class="label">Cloud</text>
        <image x="575" y="375" width="50" height="50" href="aws-logo.png"/>
    </g>
    
    <!-- Connections -->
    <line x1="250" y1="100" x2="350" y2="200" class="connection"/>
    <line x1="450" y1="200" x2="550" y2="100" class="connection"/>
    <line x1="250" y1="400" x2="350" y2="300" class="connection"/>
    <line x1="450" y1="300" x2="550" y2="400" class="connection"/>
</svg>
